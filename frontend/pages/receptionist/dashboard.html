<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receptionist Desk - Dhyey Clinic</title>
  <meta name="description" content="Receptionist portal for Dhyey Clinic. Register families, add patients, manage patient queue." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/receptionist.css" />
  <style>
    /* ---- Receptionist-specific extras ---- */
    .queue-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: #dc2626; color: #fff; border-radius: 999px;
      font-size: 10px; font-weight: 800; min-width: 18px; height: 18px; padding: 0 5px;
      margin-left: 6px; line-height: 1;
    }
    .token-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--primary-teal); color: #fff;
      border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 800;
    }
    .status-pill-waiting  { background: #fef9c3; color: #a16207; border: 1px solid #fde68a; }
    .status-pill-in-consultation { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-pill-done { background: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
    .queue-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 14px 16px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
      transition: box-shadow .15s;
    }
    .queue-card:hover { box-shadow: 0 4px 18px rgba(20,107,92,0.1); }
    .queue-token-num { font-size: 22px; font-weight: 900; color: var(--primary-teal); width: 44px; text-align: center; }
    .queue-info strong { font-size: 13px; color: var(--text-main); display: block; }
    .queue-info span { font-size: 11px; color: var(--text-muted); }
    .btn-start-consult {
      background: var(--primary-teal); color: #fff; border: none;
      border-radius: var(--radius-md); padding: 7px 14px;
      font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .btn-start-consult:hover { background: #0d7e74; }
    .btn-remove-queue {
      background: none; border: 1px solid #fca5a5; color: #b91c1c;
      border-radius: var(--radius-md); padding: 5px 10px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn-remove-queue:hover { background: #fff1f2; }
    .section-divider { border: none; border-top: 1px solid var(--border-color); margin: 16px 0 12px; }
    .form-error { color: #b91c1c; font-size: 11px; margin-top: 3px; display: none; }
    .form-error.show { display: block; }
    .patient-found-card {
      background: rgba(20,107,92,0.06); border: 1px solid var(--primary-teal-border);
      border-radius: var(--radius-md); padding: 12px 14px; margin-top: 10px;
    }
    .family-member-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border-color);
    }
    .family-member-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
<div class="app-container">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="mainSidebar">
    <div>
      <div class="sidebar-header">
        <div class="brand-logo" style="background: var(--primary-teal);">
          <i class="fa-solid fa-clipboard-user"></i>
        </div>
        <div>
          <span class="brand-title" id="sb-clinic-name">Dhyey Clinic</span>
          <div style="font-size:11px; color:var(--text-muted); font-weight:600;">Reception OPD Desk</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Receptionist navigation">
        <a class="nav-item active" id="nav-dashboard" href="javascript:void(0)" onclick="switchView('dashboard')">
          <div class="nav-item-left"><i class="fa-solid fa-gauge-high nav-icon"></i><span>Dashboard</span></div>
          <span class="badge-key">F4</span>
        </a>
        <a class="nav-item" id="nav-reg" href="javascript:void(0)" onclick="switchView('reg')">
          <div class="nav-item-left"><i class="fa-solid fa-id-card nav-icon"></i><span>Family Registration</span></div>
          <span class="badge-key">F1</span>
        </a>
        <a class="nav-item" id="nav-member" href="javascript:void(0)" onclick="switchView('member')">
          <div class="nav-item-left"><i class="fa-solid fa-user-plus nav-icon"></i><span>Add Member</span></div>
          <span class="badge-key">F2</span>
        </a>
        <a class="nav-item" id="nav-queue-mgmt" href="javascript:void(0)" onclick="switchView('queue')">
          <div class="nav-item-left"><i class="fa-solid fa-list-check nav-icon"></i><span>Patient Queue</span></div>
          <span class="badge-key" id="queue-count-badge">F3</span>
        </a>
        <a class="nav-item" id="nav-search" href="javascript:void(0)" onclick="switchView('search')">
          <div class="nav-item-left"><i class="fa-solid fa-magnifying-glass nav-icon"></i><span>Find Patient</span></div>
          <span class="badge-key">F5</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer-guide">
      <h6 style="color:var(--text-muted); font-size:11px; margin-bottom:8px;">Reception Quick Keys</h6>
      <div><kbd class="badge-key">F1</kbd> Family Reg</div>
      <div><kbd class="badge-key">F2</kbd> Add Member</div>
      <div><kbd class="badge-key">F3</kbd> Patient Queue</div>
      <div><kbd class="badge-key">F4</kbd> Dashboard</div>
      <div><kbd class="badge-key">F5</kbd> Find Patient</div>
      <div><kbd class="badge-key">/</kbd> Search focus</div>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main-wrapper">
    <!-- TOP NAVBAR -->
    <header class="top-navbar">
      <div class="top-navbar-left">
        <button class="menu-toggle-btn" aria-label="Toggle sidebar" onclick="document.getElementById('mainSidebar').classList.toggle('is-collapsed')">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="page-title-group">
          <h1 class="page-header-title" id="view-title">
            <i class="fa-solid fa-clipboard-user"></i> Reception Desk
          </h1>
          <span class="page-header-date" id="headerDate"></span>
        </div>
      </div>

      <div class="top-navbar-right">
        <div class="top-search-form">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="globalSearchInput" class="top-search-input" type="text"
            placeholder="Search patient, family head, mobile..." oninput="globalSearch(this.value)" />
          <span class="search-shortcut-tag">/</span>
        </div>
        <button class="btn-icon" type="button" title="Toggle theme" onclick="toggleTheme()">
          <i class="fa-regular fa-moon" id="themeIcon"></i>
        </button>
        <button class="btn-icon" type="button" title="Logout" style="color:#b91c1c;" onclick="handleLogout()">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- CONTENT BODY -->
    <div class="content-body" id="mainContent" aria-live="polite">
      <!-- Views rendered here by JS -->
    </div>

    <footer class="bottom-ticker-bar">
      <div id="sb-clinic-footer">Dhyey Clinic · Reception Desk</div>
      <div class="ticker-time" id="receptionClock"></div>
    </footer>
  </main>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modals Mount -->
<div id="modalMount"></div>

<script type="module" src="../../js/receptionist.js"></script>
</body>
</html>
