<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dhyey Clinic Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="cms-root">
  <div class="cms-login-page">
    <div class="cms-login-backdrop"></div>
    <div class="cms-login-card">
      <div class="cms-login-avatar"><i class="fa-solid fa-hospital"></i></div>
      <h1 class="cms-login-title">Dhyey Clinic Portal</h1>
      <p class="cms-login-desc">Sign in to manage patient records, clinical visits, pharmacy, and billing seamlessly.</p>

      <div id="login-error-msg" class="cms-login-alert" style="display: none;">
        <span><i class="fa-solid fa-triangle-exclamation"></i></span>
        <span id="login-error-text">Invalid username or password</span>
      </div>

      <form id="standalone-login-form" class="cms-login-form">
        <div class="cms-login-input-group">
          <i><i class="fa-solid fa-user"></i></i>
          <input type="text" id="login-username" class="cms-login-input" placeholder="Username (e.g. dhyey or admin)" required autofocus />
        </div>

        <div class="cms-login-input-group">
          <i><i class="fa-solid fa-lock"></i></i>
          <input type="password" id="login-password" class="cms-login-input" placeholder="Password (e.g. 123 or admin)" required />
        </div>

        <button type="submit" class="cms-login-submit">
          <span>Sign In</span>
          <span><i class="fa-solid fa-arrow-right"></i></span>
        </button>
      </form>

      <div class="cms-login-footer-hints">
        <b>Demo Doctor:</b> <code>dhyey</code> / <code>123</code> &middot; <b>Admin:</b> <code>admin</code> / <code>admin</code>
      </div>
    </div>
  </div>

  <script type="module">
    import { loginUser } from '../js/auth.js';
    document.getElementById('standalone-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      try {
        await loginUser(u, p);
        window.location.href = '../index.html';
      } catch (err) {
        document.getElementById('login-error-text').textContent = err.message || 'Invalid credentials';
        document.getElementById('login-error-msg').style.display = 'flex';
      }
    });
  </script>
</body>
</html>
