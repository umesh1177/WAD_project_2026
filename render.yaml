# ============================================================
# Render.com Deployment Configuration
# ============================================================
# Deploy at: https://render.com
# Connect your GitHub repo and Render will use this file.

services:
  - type: web
    name: dhyey-clinic-cms
    runtime: node
    region: singapore  # closest to India
    plan: free

    # Build command: install backend dependencies
    buildCommand: npm install --prefix backend

    # Start command
    startCommand: npm start

    # Health check
    healthCheckPath: /api/health

    # Environment variables (set these in Render dashboard)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render assigns port 10000 by default
      - key: MONGO_URI
        sync: false    # Set manually in Render dashboard (keep secret)
      - key: JWT_SECRET
        sync: false    # Set manually in Render dashboard (keep secret)
      - key: JWT_EXPIRE
        value: 30d
